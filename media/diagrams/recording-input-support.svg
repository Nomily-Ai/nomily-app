<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc">
  <title id="title">Nomily recording input support</title>
  <desc id="desc">Nomily currently supports V05E in both native clients, iPhone audio imports and Apple Watch recording on iOS. Future recorder models require separate verification.</desc>
  <defs><style>.title{font:700 30px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#111318}.label{font:700 17px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#111318}.small{font:500 13px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#59616d}.status{font:700 12px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.arrow{stroke:#8c949f;stroke-width:2;fill:none;marker-end:url(#arrow)}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8c949f"/></marker></defs>
  <rect width="1000" height="450" rx="24" fill="#fbfbfc"/>
  <text x="48" y="64" class="title">Recording input support</text>
  <text x="48" y="91" class="small">Each device family is evaluated separately. Recording capability alone does not imply Nomily support.</text>
  <rect x="48" y="140" width="196" height="154" rx="16" fill="#fff" stroke="#dfe3e8"/>
  <text x="72" y="178" class="label">V05E recorder</text><text x="72" y="207" class="small">BLE recording transfer</text><text x="72" y="230" class="small">Both native clients</text><rect x="72" y="250" width="108" height="24" rx="12" fill="#e5f5ed"/><text x="86" y="267" class="status" fill="#176b43">IMPLEMENTED</text>
  <rect x="277" y="140" width="196" height="154" rx="16" fill="#fff" stroke="#dfe3e8"/>
  <text x="301" y="178" class="label">iPhone import</text><text x="301" y="207" class="small">Import and organise audio</text><text x="301" y="230" class="small">iOS client</text><rect x="301" y="250" width="108" height="24" rx="12" fill="#e5f5ed"/><text x="315" y="267" class="status" fill="#176b43">IMPLEMENTED</text>
  <rect x="506" y="140" width="196" height="154" rx="16" fill="#fff" stroke="#dfe3e8"/>
  <text x="530" y="178" class="label">Apple Watch</text><text x="530" y="207" class="small">Record then transfer</text><text x="530" y="230" class="small">Paired iPhone workflow</text><rect x="530" y="250" width="108" height="24" rx="12" fill="#e5f5ed"/><text x="544" y="267" class="status" fill="#176b43">IMPLEMENTED</text>
  <rect x="735" y="140" width="217" height="154" rx="16" fill="#fff" stroke="#dfe3e8" stroke-dasharray="6 5"/>
  <text x="759" y="178" class="label">Other recorders</text><text x="759" y="207" class="small">Model-specific protocol</text><text x="759" y="230" class="small">and firmware validation</text><rect x="759" y="250" width="136" height="24" rx="12" fill="#f5f0e2"/><text x="773" y="267" class="status" fill="#826300">NOT COMMITTED</text>
  <path d="M146 330 H846" class="arrow"/>
  <rect x="356" y="347" width="290" height="58" rx="14" fill="#111318"/>
  <text x="501" y="374" text-anchor="middle" font-family="system-ui,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif" font-size="17" font-weight="700" fill="#fff">Nomily client workflow</text><text x="501" y="395" text-anchor="middle" font-family="system-ui,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif" font-size="12" fill="#cbd1d8">Library → transcription → summary</text>
</svg>
