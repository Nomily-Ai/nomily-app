name: Documentation and reference checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate documentation diagrams
        run: python3 -c "import sys, xml.etree.ElementTree as ET; [ET.parse(path) for path in sys.argv[1:]]" media/diagrams/*.svg
      - name: Compile local ASR reference service
        run: python3 -m compileall -q examples/local-asr-server/nomily_local_asr
      - name: Verify project entry points
        run: |
          test -f AGENTS.md
          test -f README.md
          test -f README.zh-CN.md
          test -f README.zh-TW.md
          test -f media/devices/README.md
